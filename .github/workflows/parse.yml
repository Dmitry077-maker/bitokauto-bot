name: Auto Parser & Uploader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-parser:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Обязательно для права пуша в репозиторий!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run parser script
        run: python parser.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add cars.json
          git commit -m "Auto-update cars.json via GitHub Actions" || echo "No changes to commit"
          git push
